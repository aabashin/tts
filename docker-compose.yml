---
version: "1.0"

services:
  tts:
    build: .
    container_name: tts
    ports:
      - "7700:7700"
    volumes:
      - $PWD/logs:/app/logs:rw
      - $PWD/settings.toml:/app/settings.toml:rw
      - $PWD/models/:/app/models/:rw
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
